name: Verify viewer
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project Checks/PerformanceViewer.Checks.csproj -c Release
      - run: dotnet publish PerformanceViewer.csproj -c Release
      - run: dotnet publish Web/PerformanceViewer.Web.csproj -c Release
      - run: dotnet workload install maui-windows
      - run: dotnet build Native/PerformanceViewer.Native.csproj -c Release
